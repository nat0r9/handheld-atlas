name: Profile permissions
on:
  pull_request:
    paths:
      - 'review/profile-access/**'
      - '.github/workflows/profile-access.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -f review/profile-access/test.sql
        env:
          PGPASSWORD: disposable
